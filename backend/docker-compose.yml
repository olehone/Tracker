
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql


  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --location /data --debug /data/debug.log --skipApiVersionCheck"
    ports:
      - "10000:10000"
    volumes: 
      - azurite_data:/data


volumes:
  sqlserver_data:
  azurite_data:

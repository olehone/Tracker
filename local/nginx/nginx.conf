events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11;

    upstream backend {
        server host.docker.internal:7240;
    }

    upstream frontend {
        server host.docker.internal:5158;
    }

    server {
        listen 8080;
        server_name localhost;

        location /api {
            proxy_pass https://backend;
        }

        location /avatars {
            proxy_pass https://backend;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}

<head>

          content="width=device-width, initial-scale=1.0" />
    <title>Tracker.WebApp</title>
    <base href="/" />
    <link rel="icon"
          type="image/png"
          href="favicon.png" />
    <link href="manifest.webmanifest"
          rel="manifest" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"

           style="color: #000; margin-left: 0.5rem; font-weight:bold;">Reload</a>
        <a class="dismiss"
           style="color: #000; margin-left: 0.5rem; font-weight:bold;">Close</a>
    </div>

    <script>navigator.serviceWorker.register('js/service-worker.js');</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"></script>
